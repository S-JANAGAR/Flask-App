<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to right, #f0f4f8, #d9e2ec);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin-top: 50px;
            color: #2c3e50;
            font-size: 3em;
        }

        div {
            margin-top: 40px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        a {
            text-decoration: none;
        }

        h2 {
            background-color: #3498db;
            color: white;
            padding: 15px 30px;
            border-radius:0 8px;
            text-align: center;
            transition: background-color 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h2:hover {
            background-color: #a2a4a5a7;
            color: rgb(159, 7, 121);
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Address Book</h1>
    <div>
        <a href="/addContact"><h2>Add Contact</h2></a>
        <a href="/search"><h2>Search Contact</h2></a>
        <a href="/viewContact"><h2>View Contact</h2></a>
        <a href="/delete"><h2>Delete Contact</h2></a>
    </div>
</body>
</html>
